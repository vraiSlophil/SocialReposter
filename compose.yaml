services:
  tiktok-downloader:
    image: socialreposter-tiktok-downloader:local
    pull_policy: never
    build:
      context: .
      dockerfile: docker/feasibility/Dockerfile
      args:
        BASE_IMAGE: "unclecode/crawl4ai:0.9.0"
        YT_DLP_VERSION: "2026.7.4"
    volumes:
      - ./downloads:/downloads
